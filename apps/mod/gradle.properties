# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# IntelliJ is not fully compatible with the configuration cache under Loom.
org.gradle.configuration-cache=false

# Fabric — every value here is verified in DECISIONS.md §3 against a primary
# source. Do not bump from memory; re-query meta.fabricmc.net / Modrinth.
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.156.0+26.2

# Pinned deliberately. The official template uses 1.17-SNAPSHOT, but the jar is
# committed and verified by hash in CI, and a snapshot dependency would change
# underneath that gate. Reproducibility requires pinned inputs.
loom_version=1.17.17

# Mod
mod_version=1.0.2
maven_group=com.mcsm
archives_base_name=mcsm-helper
