# Managed by deploy/provision.sh. Edit it in the repo, not on the server.
#
# Lets admins reboot this host from the dashboard (Nodes -> Reboot host). The
# agent still asks logind first, so this does nothing without the polkit grant
# in deploy/polkit/, which provision.sh installs alongside it.
[Service]
Environment=AGENT_ALLOW_REBOOT=1
