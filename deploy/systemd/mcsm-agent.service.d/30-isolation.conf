# Managed by deploy/provision.sh. Edit it in the repo, not on the server.
#
# Runs Minecraft servers (and the installers that build them) as the mcsm-mc
# user through /usr/local/libexec/mcsm/mcsm-launch, so a mod or plugin cannot
# read the panel's database, secrets, or other servers' launch tokens. See
# docs/security.md.
#
# The agent keeps CAP_KILL so it can stop a server running as another user; it
# clears it from its ambient set at startup, so no child inherits it.
#
# Opting out: AGENT_ISOLATE_SERVERS=0 in secrets.env (applied after this file,
# so it wins) runs servers as mcsm again, with everything mcsm can reach.
[Service]
AmbientCapabilities=CAP_KILL
Environment=AGENT_ISOLATE_SERVERS=1
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
