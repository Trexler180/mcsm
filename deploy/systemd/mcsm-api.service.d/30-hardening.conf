# Managed by deploy/provision.sh. Edit it in the repo, not on the server.
#
# Confines the API. It needs to write only its data directory (DATABASE_PATH)
# and temporary files, so the system and home directories are read-only or
# hidden, it can never gain privileges, and other users' processes are
# invisible to it.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectHome=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
