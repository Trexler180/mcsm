# Managed by deploy/provision.sh. Edit it in the repo, not on the server.
#
# Non-secret settings for the API. Secrets stay in secrets.env; anything set
# there overrides these, because systemd applies EnvironmentFile= after
# Environment=.
[Service]
# Where the SPA is served. The OAuth consent link is built from it, so it must
# match the deploy's web base (Deploy-Dashboard.ps1 $WebBase); provision.sh
# refuses to apply if they disagree.
Environment=APP_BASE_PATH=/dashboard/
