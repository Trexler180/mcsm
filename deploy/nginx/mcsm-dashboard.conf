# MCSM dashboard (test) — SPA under /dashboard, API proxied at /api.
#
# Managed by deploy/provision.sh, installed to /etc/nginx/snippets/ and included
# from the site's 443 server block. Edit it in the repo, not on the server: the
# next provision would report the difference and an apply would replace it.
location = /dashboard { return 301 /dashboard/; }

# OAuth discovery for the remote-agent (MCP) endpoint. Origin-rooted by
# specification, so it cannot live under /api/ — without this, a client finds
# /api/v1/mcp but never learns where to authorize.
location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration)(/|$) {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Optional: lets the API tell this proxy from any other process on the host
    # (see "Proxy secret" in docs/deployment.md). Matches nothing until the
    # file is created, and a wildcard include of nothing is not an error.
    include /etc/nginx/mcsm-proxy-secret*.conf;
}

location /dashboard/ {
    alias /srv/dashboard/web/;
    try_files $uri $uri/ /dashboard/index.html;

    # The app's own policy travels in its <meta> tag; these are the parts a
    # tag cannot say. frame-ancestors (and X-Frame-Options, for browsers that
    # predate it) keep the panel out of other sites' frames, so a page
    # elsewhere cannot dress it up and borrow a signed-in admin's clicks.
    # `always` covers error pages too. Set here rather than left to the site's
    # server block so provisioning can see when they are missing; add_header
    # at this level replaces any the server block sets for this location.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# World uploads push a whole zipped world (gigabytes) through to the agent, so
# they get their own rule: no size cap, and the body is streamed straight
# through instead of being spooled to nginx's disk first. Every other API call
# keeps the 64m cap and default buffering below. Size is enforced by the API
# (16 GiB) and by the agent's free-disk check, not here.
location ~ ^/api/v1/servers/[^/]+/worlds/upload$ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Optional: lets the API tell this proxy from any other process on the host
    # (see "Proxy secret" in docs/deployment.md). Matches nothing until the
    # file is created, and a wildcard include of nothing is not an error.
    include /etc/nginx/mcsm-proxy-secret*.conf;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /api/ {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Optional: lets the API tell this proxy from any other process on the host
    # (see "Proxy secret" in docs/deployment.md). Matches nothing until the
    # file is created, and a wildcard include of nothing is not an error.
    include /etc/nginx/mcsm-proxy-secret*.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Public status pages (per-server, opt-in), rendered by the API.
location /status/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Optional: lets the API tell this proxy from any other process on the host
    # (see "Proxy secret" in docs/deployment.md). Matches nothing until the
    # file is created, and a wildcard include of nothing is not an error.
    include /etc/nginx/mcsm-proxy-secret*.conf;
}
